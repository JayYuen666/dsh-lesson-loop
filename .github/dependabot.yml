# 依赖更新：action 一条线。
#
# action 侧覆盖本仓的全部 workflow 引用：这些引用都钉了 commit SHA，Dependabot 提的 PR
# 会把「换了哪个提交」变成一次可评审的 diff。
#
# 这里刻意**没有** npm 更新块：本仓依赖只有三类，三类都不该由更新机器人改动。
# 一是工具链与大部分宿主依赖写成 catalog:，那条范围的真源在伞根的 pnpm-workspace.yaml；
# 二是其余依赖写成字面版本，而每一枚都在本仓 pnpm-workspace.yaml 的 overrides 里被钉死
# （宿主族统一 0.2.1-rc.2 那条线）。Dependabot 对第二类提的 PR 会被 overrides 解析回原版本，
# 合进去也不改变安装树——留着它只会造出「看起来升了、实际没升」的 PR。要升这些版本只能在
# 伞根改真源，再投影下来。
# 三是 react：它写成 caret 范围且不在本仓 overrides 里（`@types/react` 在，`react` 本体不在），
# 所以 npm 更新块一旦打开，react 的 PR 是**会**真正改变安装树的。取舍是「不为一条可升级项
# 把另外三十余条由 overrides 钉死的依赖的噪音放进来」——react 的升级因此由人手动做，
# 不是被遗漏的更新面。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 本仓引用的 action 全部放进一组，避免每个 action 各占一个 PR 去抢同一个名额。
      # 模式用单个 `*`：Dependabot 的 pattern 里 `*` 是通配符（dependabot-core 的
      # wildcard_match? 把 pattern 按 `*` 切成字面段再用 `.*` 连接），所以一条就覆盖
      # 全部依赖名——包括将来新引入的 owner（如 docker/*），以及 codeql-action 的
      # init / analyze / upload-sarif 三条子路径引用。逐个列 owner 的白名单会让新增
      # owner 静默落到组外，单独占掉 open-pull-requests-limit 的名额。
      actions:
        patterns:
          - "*"
