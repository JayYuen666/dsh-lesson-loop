name: publish
on:
  workflow_dispatch: {}
# 两次手动 dispatch 撞上同一版本时，后一个只是拿版本冲突收尾；真正的浪费是两个 runner 并行
# 跑同一份 check + publish，而且日志顺序会分不清哪一次落到了 registry。
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
# 构建与发布拆成两个 job：install 与 check 会跑仓库与依赖的生命周期脚本，那些代码与
# 发布凭据不能共享同一个 runner 的 OIDC 环境——所以 id-token: write 只落在真正执行
# pnpm publish 的 publish job 里，build job 拿不到它。被投毒的依赖脚本因此读不到
# ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN，换不出 npm 发布凭据。
# 优先级方向别读反：本包在 npmjs 上配好 trusted publisher 之后，OIDC 赢过 NODE_AUTH_TOKEN
# （pnpm 的 publish_options.rs 原话："OIDC takes precedence over a configured static token"），
# 交换成功时静态 secret 根本不被读到；只有交换失败（没配、权限不足、配置过期）才回落到它。
jobs:
  build:
    runs-on: ubuntu-latest
    # install + 完整 check + 打包，一分钟都不该无上限地烧。
    timeout-minutes: 45
    steps:
      # 发布只允许从默认分支派发：workflow_dispatch 能在任意分支/tag 上触发，而 publish 会把
      # 检出时刻的那棵树原样推到 registry——版本号一旦占用就撤不回，只能弃号再发新版。
      # 用「失败」而不是 job 级 `if:` 跳过：跳过在结论上是绿的，误点的人只会看到工作流"成功"。
      - name: 确认发布只发生在默认分支
        env:
          TARGET_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::发布只能从默认分支（$DEFAULT_BRANCH）派发，当前是 $TARGET_REF。要发版请先把改动合进默认分支再 dispatch。"
            exit 1
          fi
      # action 按 tag 引用意味着上游动 tag 就等于本仓换了构建器。钉 commit SHA，
      # tag 版本写在同行注释里，升级时照着改这一行即可。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本仓的 workflow 不用 git 写动词，token 没必要留在 .git/config 里：
          # 后续步骤会跑仓库自己的 install/构建/测试脚本，也就跑得到依赖里的脚本。
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 静态 token 是 OIDC 失败时的兜底，不是发布的前提：仓库里没有这枚 secret 是正常状态，
      # 走 trusted publishing 的仓库本来就不该长期存它。所以这一步在值为空时放行，只把
      # 凭据本身不跨步骤传递：步骤输出会落成 RUNNER_TEMP 下的文件，同 job 后续步骤
      # （含 install 与 check 里跑的依赖脚本）都能枚举读到；写进 job 级环境同理。
      # 所以这里只做形态校验，预检与发布各自从 secrets 取一次、各自就地清洗。
      - name: 规范化静态 token（存在才处理）
        id: norm
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_TIDY="$(printf '%s' "${TOKEN:-}" | tr -d '\r\n[:space:]')"
          if [ -z "$TOKEN_TIDY" ]; then
            echo "NPM_TOKEN 未配置：按 OIDC 发布，本次不设 NODE_AUTH_TOKEN"
            exit 0
          fi
          if [ "$TOKEN" != "$TOKEN_TIDY" ]; then echo "注意：secret 里含空白/换行，已剔除后使用"; fi
          echo "::add-mask::$TOKEN_TIDY"
          case "$TOKEN_TIDY" in
            npm_*) echo "token 形态：npm access token";;
            ghp_*|github_pat_*) echo "这是 GitHub token——发到公共 npm 需要 npm 站点自己的 token（www.npmjs.com → Access Tokens），GH 的 token 对 npmjs 无效"; exit 1;;
            *) echo "注意：前缀不是 npm_，请确认它确实是 npm 的 access token";;
          esac
          junk=$(printf %s "$TOKEN_TIDY" | tr -d "A-Za-z0-9_-" | wc -c | tr -d " ")
          # 只报「有没有杂质」，不报长度：凭据的字符数是关于凭据本身的信息，CI 日志会长期留存。
          echo "token 度量：非法字符数=$junk"
          if [ "$junk" != "0" ]; then
            echo "凭据里混进了非 token 字符（引号、说明文字之类）——请只贴 npm_ 开头那一串，不要带引号"
            exit 1
          fi
          # 只交出形态合格的结论；凭据本身留在本步骤，不写进任何可跨步骤读取的介质。
      # 静态 token 只是兜底，所以这里判的是「还能不能用」，不是「必须有效」：
      #   · 200      → 原样传给发布步
      #   · 401/403  → 告警并清空，让发布步走 OIDC。凭据失效不是工作流该红的理由，
      #                OIDC 也没配好时发布步会在认证处以 ENEEDAUTH 红，那一步才是真判据。
      #   · 其它状态 → registry 侧异常，先查状态页，不发
      # 依赖库可见性的判据与凭据无关，三条路都跑。放在 build job 而不是发布侧：
      # 判据要读 package.json（本包与 shared 的名字），而发布 job 刻意不检出仓库。
      - name: registry 预检（本包现状与依赖库可见性）
        id: precheck
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          USE_STATIC=false
          PASS_TOKEN="$(printf '%s' "${TOKEN:-}" | tr -d '\r\n[:space:]')"
          if [ -n "$PASS_TOKEN" ]; then echo "::add-mask::$PASS_TOKEN"; fi

          if [ -n "$PASS_TOKEN" ]; then
            body="$(mktemp)"
            code=$(curl -s -o "$body" -w "%{http_code}" -H "Authorization: Bearer $PASS_TOKEN" "https://registry.npmjs.org/-/whoami")
            case "$code" in
              200)
                login=$(sed -n 's/.*"username"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$body")
                rm -f "$body"
                USE_STATIC=true
                # 响应体里是账号名，CI 日志长期留存，只印脱敏摘要。
                if [ -n "$login" ]; then echo "whoami: HTTP 200，账号 ${login:0:2}***"; else echo "whoami: HTTP 200（响应体未解析出账号名）"; fi
                ;;
              401|403)
                rm -f "$body"
                echo "::warning::静态 token 被 registry 拒（HTTP $code）——本次不启用它，按 OIDC 发布。这枚 secret 已失效，用完请到 Settings → Secrets 删掉，否则每次发布都留一条本行告警。"
                PASS_TOKEN=""
                ;;
              *)
                rm -f "$body"
                echo "whoami 返回 HTTP $code——既不是 200 也不是凭据被拒的 401/403，属 registry 侧异常，先查状态页再发"
                exit 1
                ;;
            esac
          else
            echo "whoami: 跳过——本次没有静态 token，按 OIDC 发布"
          fi
          # 本包自身也要查：只查依赖的话，「版本号没进 main 就触发 workflow」这个最常见的
          # 失败模式预检根本发现不了，只能等 publish 自己以版本冲突收尾。
          self=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@jayyuen66%2fdsh-lesson-loop")
          echo "读本包：HTTP $self"
          case "$self" in
            404) echo "判读：首发（正常）";;
            200) echo "判读：已发过——确认 package.json 的 version 比 registry 上的新，否则 publish 会撞版本冲突";;
            *) echo "预检失败：本包读取返回 $self"; exit 1;;
          esac
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@jayyuen66%2fdsh-plugin-shared")
          echo "读 @jayyuen66/dsh-plugin-shared：HTTP $code"
          echo "判读：200=依赖库已公开，可以发；404=shared 还没发到 npmjs，先发它（本包 pnpm install 会因此取不到依赖）"
          [ "$code" = "200" ] || exit 1
          # 只交结论、不交凭据：发布 job 据此决定导不导出 NODE_AUTH_TOKEN。
          printf 'use_static=%s\n' "$USE_STATIC" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # prepack 会重建 host.js / client.js / types/，产物不入库也发得出去。
      # 打包只在本 job 做一次：发布 job 拿到的就是这份字节，它自己不再跑任何仓库或依赖的代码。
      - name: 打包发布物
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg
          pnpm pack --pack-destination /tmp/pkg
      - name: 留存 tarball 供发布 job 使用
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tarball
          path: /tmp/pkg/**/*.tgz
          retention-days: 7
          if-no-files-found: error
    # 只交结论、不交凭据：静态 token 是否可用由预检判定，发布 job 据此决定导不导出 NODE_AUTH_TOKEN。
    outputs:
      use_static: ${{ steps.precheck.outputs.use_static }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 取产物 + 发布 ；发布后由 registry 逐步可见，20 分钟绰绰有余。
    # 不设上限的话，卡住的那一步会烧满 runner 的上限才被杀，期间没有任何信号。
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing（OIDC）：id-token: write 是换取短期发布凭据的前提。少了它不会
      # 安静降级：命令里带着 --provenance 时，签来源证明那一步会硬失败并报
      # ERR_PNPM_ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS。
      # registry 上该版本的 _npmUser 记作 "GitHub Actions <npm-oidc-no-reply@github.com>" 而不是
      # 发布者本人，就是这条路的痕迹：归属仍在 maintainers 与 repository 上，改不动也不必改。
      id-token: write
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      # registry-url 必须配：它把 `${NODE_AUTH_TOKEN}` 占位写进 RUNNER_TEMP/.npmrc 并用
      # NPM_CONFIG_USERCONFIG 指过去，发布步的静态 token 兜底走的就是这条机制。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 取回发布物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-tarball
          path: /tmp/pkg
      - name: 校验并解开 tarball
        run: |
          set -euo pipefail
          # 只信任 build job 传来的那份字节：数目必须恰好一枚，多了少了都是意外。
          count="$(find /tmp/pkg -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::期望恰好一枚 tarball，实际 $count——build job 的打包或上传出了意外"
            exit 1
          fi
          tarball="$(find /tmp/pkg -name '*.tgz' -print -quit)"
          rm -rf /tmp/stage
          mkdir -p /tmp/stage
          tar -xzf "$tarball" -C /tmp/stage
          test -f /tmp/stage/package/package.json
          echo "PKG_DIR=/tmp/stage/package" >> "$GITHUB_ENV"
      # 凭据优先级：OIDC 在前，这枚 NODE_AUTH_TOKEN 在后（pnpm 的 publish_options.rs 原话
      # "OIDC takes precedence over a configured static token"）。trusted publisher 配好时
      # 它根本不参与认证，交换失败才轮到它——留着是兜底，不是主路。
      # 注入的值与上面预检同款清洗（剔 \r\n 与空白）：预检用副本、publish 读原值，secret 尾部
      # 一个换行就变成「whoami 通过、publish 401」，两处必须是同一份清洗。
      # --provenance 取的是另一枚 id-token（audience 为 sigstore），与 npm 交换那枚互相独立，
      # 所以它不受 trusted publisher 是否已配影响；少了它，产物只剩 npm 自己的签名。
      # --ignore-scripts：发布对象是 build job 已经打好、check 已经验过的那份字节，这里展开成
      # 目录再发布——pnpm 对目录发布默认会跑 prepack 等生命周期脚本，而本 job 没有 node_modules，
      # 跑了必炸；跳过它们同时意味着发布侧不执行任何仓库与依赖的代码（这正是拆 job 的意义）。
      # pnpm 12 的 publish 不接受 --publish-wait-timeout（CI 实测参数解析即退 2），
      # 因此这里不带它；发布后由 registry 逐步可见。
      # 若要改成 staged 发布（CI 只 stage、人工 approve）：发布命令换成 `pnpm stage publish`。
      # 切换前先到 npmjs 上该包 Settings → Trusted publishing 看一眼 Allowed actions：npm 文档在这里
      # 两处说法不一致（网页说 `npm stage publish` 一直允许；API 却把 createStagedPackage 列成一枚
      # 可选权限），本仓没有本地判据能判它，所以别假定默认值——stage 第一步就被拒时先回来查这一页。
      # approve 两条入口，都要 2FA，走哪条由人决定：
      #   本机  `pnpm stage approve <stage-id> [--otp <码>]`（多个 id 一批共用一枚 OTP）
      #   网页  npmjs.com → 该包 → Staged Packages → Approve
      - name: 发布
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
          USE_STATIC: ${{ needs.build.outputs.use_static }}
        run: |
          set -euo pipefail
          # 只有确实拿到可用静态 token 时才导出 NODE_AUTH_TOKEN。导出空串会让 setup-node
          # 写进 .npmrc 的 ${NODE_AUTH_TOKEN} 占位被填成空值，认证以空凭据发出——
          # 那是「配了 OIDC 却没 token」这条正常路径上的失败，不是发布本身的失败。
          TOKEN_TIDY="$(printf '%s' "${TOKEN:-}" | tr -d '\r\n[:space:]')"
          if [ "$USE_STATIC" = "true" ] && [ -n "$TOKEN_TIDY" ]; then
            echo "::add-mask::$TOKEN_TIDY"
            export NODE_AUTH_TOKEN="$TOKEN_TIDY"
            echo "凭据：静态 token 已就位（OIDC 交换成功时 pnpm 仍优先用 OIDC）"
          else
            echo "凭据：OIDC trusted publishing"
          fi
          pnpm publish "$PKG_DIR" --ignore-scripts --no-git-checks --access public --provenance
