# OpenSSF Scorecard：供应链体检。
#
# 它查的正是本仓这一层关心的东西——脚本注入、token 权限、依赖是否钉版、分支保护是否
# 存在。结果同时进 code scanning 面板与 OpenSSF 公有 API（本仓是 public 仓）。
#
# publish_results 只在默认分支上有效：上传的身份由 OIDC 换得，所以要 id-token: write。
name: scorecard
on:
  # 只订阅 branch_protection_rule：GitHub Actions 的触发事件里没有 repository_ruleset
  # （它是 webhook 事件，actionlint 判为 unknown event）。因此迁到 ruleset 管理的保护
  # 策略变更不会即时重跑，Branch-Protection 一项要等下一次 cron 或 push 才刷新。
  branch_protection_rule:
  # 手动入口：同上。注意下面的 if 要求「在默认分支上跑」，所以在功能分支上手跑时该 job
  # 会被跳过——这不是故障。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
  push:
    # 只能写字面分支名（branches 过滤不吃表达式）：默认分支改名后这一条要跟着改，
    # 否则只剩 schedule 与 branch_protection_rule 两条触发路径。下面的 job 级 if
    # 用的是仓库当前的默认分支，两处不共享同一个值是有意的分工。
    branches: [main]
# 同一 ref 上后到的分析取消先到的：branch_protection_rule 事件可能短时连发，
# 叠加每周定时与 push 会出现多份并发分析，后完成的旧结果还会在 code scanning 里
# 互相覆盖。组键带事件名与 ref，与 ci/codeql 同款。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# 工作流级全只读；两个写权限只挂在 analysis job 上。
permissions: read-all
jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results: true 只在默认分支生效，所以在非默认分支上不跑这条。
    # 比较完整 ref：tag 的 ref_name 就是 tag 名——名字恰与默认分支相同的 tag 会让
    # 名字比较通过，把那棵树的分析结果当默认分支发布。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      security-events: write
      id-token: write
      # job 级 permissions 一旦写了，没列出的项一律是 none，checkout 也就读不到仓库内容。
      # 这里显式补回来：它要的是读，与上面两项写权限不冲突。
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不让 checkout 把 token 留在 .git/config 里：后续步骤不该能借它推代码。
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # 辅助产物失败（配额/服务抖动）不许挡住后面真正关键的 SARIF 上传——那才是
        # 这份分析的主结果，artifact 只是留档。
        continue-on-error: true
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
